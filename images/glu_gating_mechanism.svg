<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The GLU gating mechanism</title>
  <desc id="desc">An input vector is projected by two independent linear maps; one branch passes through an activation to become a gate in the zero-to-one range, and is multiplied elementwise with the other value branch, letting the network decide how much of each channel to pass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 15px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .lin { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; }
      .act { fill: #fde68a; stroke: #f59e0b; stroke-width: 1.5; }
      .val { fill: #bbf7d0; stroke: #22c55e; stroke-width: 1.5; }
      .mul { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1.5; }
      .io  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .flow { stroke: #475569; stroke-width: 2.4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="60" y="50" class="title">GLU：用一条"门"支路控制另一条"值"支路</text>
  <text x="60" y="78" class="subtitle">输入被两个独立线性层分别投影；门支路经激活函数压到 0~1，再与值支路逐元素相乘，逐通道决定"放行多少"。</text>

  <!-- input -->
  <rect x="70" y="270" width="150" height="70" rx="12" class="io"/>
  <text x="96" y="303" class="mono">输入 x</text>
  <text x="96" y="325" class="small">d 维隐藏向量</text>

  <!-- split to two linear -->
  <path class="flow" d="M220 300 C 270 300, 280 190, 330 190" marker-end="url(#arrow)"/>
  <path class="flow" d="M220 310 C 270 310, 280 420, 330 420" marker-end="url(#arrow)"/>

  <!-- gate linear -->
  <rect x="330" y="160" width="180" height="60" rx="10" class="lin"/>
  <text x="352" y="188" class="mono">线性层 W</text>
  <text x="352" y="208" class="small">门支路投影</text>

  <!-- value linear -->
  <rect x="330" y="390" width="180" height="60" rx="10" class="lin"/>
  <text x="352" y="418" class="mono">线性层 V</text>
  <text x="352" y="438" class="small">值支路投影</text>

  <!-- activation on gate -->
  <path class="flow" d="M510 190 L580 190" marker-end="url(#arrow)"/>
  <rect x="580" y="160" width="180" height="60" rx="10" class="act"/>
  <text x="600" y="188" class="mono">激活 σ / SiLU</text>
  <text x="600" y="208" class="small">压到 0~1 的"门"</text>

  <!-- value passes straight -->
  <path class="flow" d="M510 420 L760 420" marker-end="url(#arrow)"/>
  <text x="600" y="410" class="small">值支路通常不激活（线性）</text>

  <!-- multiply -->
  <path class="flow" d="M760 190 C 850 190, 860 290, 880 300" marker-end="url(#arrow)"/>
  <path class="flow" d="M760 420 C 850 420, 860 320, 880 310" marker-end="url(#arrow)"/>
  <circle cx="920" cy="305" r="40" class="mul"/>
  <text x="906" y="315" class="mono">&#8857;</text>
  <text x="880" y="380" class="small">逐元素相乘</text>

  <!-- output -->
  <path class="flow" d="M960 305 L1010 305" marker-end="url(#arrow)"/>
  <rect x="1010" y="270" width="150" height="70" rx="12" class="io"/>
  <text x="1036" y="303" class="mono">输出</text>
  <text x="1030" y="325" class="small">被门控后的值</text>

  <!-- formula -->
  <rect x="330" y="500" width="540" height="70" rx="12" class="io"/>
  <text x="352" y="530" class="head">GLU(x) = ( xW ) &#8857; &#963;( xV )</text>
  <text x="352" y="556" class="small">&#8857; 为逐元素相乘；&#963; 可替换为 SiLU、GELU 等，得到不同 GLU 变体</text>
</svg>
