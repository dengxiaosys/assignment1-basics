<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Tokenization granularity trade-off</title>
  <desc id="desc">A comparison of word-level, subword, character-level, and byte-level tokenization by vocabulary size, sequence length, coverage, and robustness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .mono { font: 500 14px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .token { stroke-width: 1.1; rx: 7; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="60" y="55" class="title">Tokenization granularity is a systems trade-off</text>
  <text x="60" y="82" class="subtitle">Finer units improve coverage and robustness; coarser units shorten sequences but enlarge the vocabulary.</text>

  <rect x="55" y="120" width="255" height="420" class="card"/>
  <rect x="55" y="120" width="255" height="58" rx="14" fill="#fee2e2"/>
  <text x="78" y="155" class="head">Word-level</text>
  <text x="78" y="208" class="small">EXAMPLE</text>
  <rect x="78" y="222" width="91" height="38" class="token" fill="#fecaca" stroke="#f87171"/>
  <rect x="177" y="222" width="109" height="38" class="token" fill="#fecaca" stroke="#f87171"/>
  <text x="97" y="246" class="mono">unseen</text>
  <text x="196" y="246" class="mono">word</text>
  <text x="78" y="300" class="body">Vocabulary: very large</text>
  <text x="78" y="328" class="body">Sequence: shortest</text>
  <text x="78" y="356" class="body">OOV risk: high</text>
  <text x="78" y="384" class="body">Typos: brittle</text>
  <text x="78" y="425" class="body">Good when the domain is</text>
  <text x="78" y="447" class="body">small and vocabulary is</text>
  <text x="78" y="469" class="body">stable.</text>

  <rect x="335" y="120" width="255" height="420" class="card"/>
  <rect x="335" y="120" width="255" height="58" rx="14" fill="#dcfce7"/>
  <text x="358" y="155" class="head">Subword (BPE)</text>
  <text x="358" y="208" class="small">EXAMPLE</text>
  <rect x="358" y="222" width="61" height="38" class="token" fill="#bbf7d0" stroke="#4ade80"/>
  <rect x="427" y="222" width="71" height="38" class="token" fill="#bbf7d0" stroke="#4ade80"/>
  <rect x="506" y="222" width="61" height="38" class="token" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="372" y="246" class="mono">un</text>
  <text x="438" y="246" class="mono">seen</text>
  <text x="523" y="246" class="mono">word</text>
  <text x="358" y="300" class="body">Vocabulary: medium</text>
  <text x="358" y="328" class="body">Sequence: medium</text>
  <text x="358" y="356" class="body">OOV risk: none with bytes</text>
  <text x="358" y="384" class="body">Typos: localized cost</text>
  <text x="358" y="425" class="body">Balances embedding and</text>
  <text x="358" y="447" class="body">softmax cost against</text>
  <text x="358" y="469" class="body">attention sequence length.</text>

  <rect x="615" y="120" width="255" height="420" class="card"/>
  <rect x="615" y="120" width="255" height="58" rx="14" fill="#dbeafe"/>
  <text x="638" y="155" class="head">Character-level</text>
  <text x="638" y="208" class="small">EXAMPLE</text>
  <g fill="#bfdbfe" stroke="#60a5fa">
    <rect x="638" y="222" width="38" height="38" class="token"/>
    <rect x="682" y="222" width="38" height="38" class="token"/>
    <rect x="726" y="222" width="38" height="38" class="token"/>
    <rect x="770" y="222" width="38" height="38" class="token"/>
    <rect x="814" y="222" width="38" height="38" class="token"/>
  </g>
  <text x="651" y="246" class="mono">u</text>
  <text x="695" y="246" class="mono">n</text>
  <text x="739" y="246" class="mono">s</text>
  <text x="783" y="246" class="mono">e</text>
  <text x="827" y="246" class="mono">e</text>
  <text x="638" y="300" class="body">Vocabulary: script-sized</text>
  <text x="638" y="328" class="body">Sequence: long</text>
  <text x="638" y="356" class="body">OOV risk: Unicode-dependent</text>
  <text x="638" y="384" class="body">Typos: robust</text>
  <text x="638" y="425" class="body">Simple semantics, but a</text>
  <text x="638" y="447" class="body">large multilingual code-point</text>
  <text x="638" y="469" class="body">inventory remains sparse.</text>

  <rect x="895" y="120" width="250" height="420" class="card"/>
  <rect x="895" y="120" width="250" height="58" rx="14" fill="#fef3c7"/>
  <text x="918" y="155" class="head">Byte-level</text>
  <text x="918" y="208" class="small">EXAMPLE (UTF-8)</text>
  <g fill="#fde68a" stroke="#f59e0b">
    <rect x="918" y="222" width="48" height="38" class="token"/>
    <rect x="974" y="222" width="48" height="38" class="token"/>
    <rect x="1030" y="222" width="48" height="38" class="token"/>
    <rect x="1086" y="222" width="38" height="38" class="token"/>
  </g>
  <text x="926" y="246" class="mono">f0</text>
  <text x="982" y="246" class="mono">9f</text>
  <text x="1038" y="246" class="mono">99</text>
  <text x="1090" y="246" class="mono">82</text>
  <text x="918" y="300" class="body">Vocabulary: exactly 256</text>
  <text x="918" y="328" class="body">Sequence: longest</text>
  <text x="918" y="356" class="body">OOV risk: none</text>
  <text x="918" y="384" class="body">Noise: most robust</text>
  <text x="918" y="425" class="body">Universal representation,</text>
  <text x="918" y="447" class="body">but shifts more work into</text>
  <text x="918" y="469" class="body">the sequence model.</text>

  <line x1="115" y1="585" x2="1085" y2="585" stroke="#64748b" stroke-width="3"/>
  <path d="M1085 585 L1068 576 L1068 594 Z" fill="#64748b"/>
  <text x="55" y="625" class="body">Coarser units: larger vocabulary, shorter sequence</text>
  <text x="805" y="625" class="body">Finer units: smaller vocabulary, longer sequence</text>
</svg>
