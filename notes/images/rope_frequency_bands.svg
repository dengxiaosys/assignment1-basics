<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">RoPE multi-frequency bands</title>
  <desc id="desc">RoPE assigns each 2D pair of the head dimension a different rotation frequency, from fast-rotating pairs that capture nearby relations to slow-rotating pairs that capture long-range position, analogous to the hands of a clock spinning at different speeds.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 29px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13.5px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow3); }
      .dial { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .hand { stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="url(#bg3)"/>
  <text x="60" y="48" class="title">多频率：每个二维对像转速不同的钟表指针</text>
  <text x="60" y="76" class="subtitle">头维度里靠前的对转得快（捕捉近距离细节），靠后的对转得慢（捕捉长距离位置），组合出多尺度的相对位置感。</text>

  <!-- four dials -->
  <g>
    <!-- pair 0 fast -->
    <circle cx="230" cy="260" r="95" class="dial"/>
    <line class="hand" x1="230" y1="260" x2="300" y2="205" stroke="#ef4444"/>
    <text x="180" y="150" class="head">对 0：高频</text>
    <text x="150" y="390" class="small">&#952;&#8320; 最大，转得最快</text>
    <text x="150" y="410" class="small">位置每+1，转很大角度</text>
    <text x="150" y="430" class="mono">捕捉近距离关系</text>

    <!-- pair 1 -->
    <circle cx="470" cy="260" r="95" class="dial"/>
    <line class="hand" x1="470" y1="260" x2="545" y2="235" stroke="#f59e0b"/>
    <text x="425" y="150" class="head">对 1：较高频</text>
    <text x="410" y="390" class="small">转速中偏快</text>

    <!-- pair k -->
    <circle cx="710" cy="260" r="95" class="dial"/>
    <line class="hand" x1="710" y1="260" x2="785" y2="255" stroke="#3b82f6"/>
    <text x="665" y="150" class="head">对 k：较低频</text>
    <text x="650" y="390" class="small">转速中偏慢</text>

    <!-- pair last slow -->
    <circle cx="950" cy="260" r="95" class="dial"/>
    <line class="hand" x1="950" y1="260" x2="1012" y2="242" stroke="#8b5cf6"/>
    <text x="905" y="150" class="head">最后一对：低频</text>
    <text x="890" y="390" class="small">&#952; 最小，转得最慢</text>
    <text x="890" y="410" class="small">位置变很多才转一点</text>
    <text x="890" y="430" class="mono">捕捉长距离位置</text>
  </g>

  <!-- frequency formula -->
  <rect x="150" y="470" width="900" height="120" rx="14" class="card"/>
  <text x="176" y="504" class="head">频率如何设定</text>
  <text x="176" y="536" class="mono">&#952;&#7522; = base^(&#8722;2i/d)，　i = 0,1,&#8230;,d/2&#8722;1　（base 常取 10000）</text>
  <text x="176" y="566" class="body">i 越大频率越低。低频对旋转缓慢，是长上下文扩展（NTK / 位置插值）主要调整的对象。</text>
</svg>
