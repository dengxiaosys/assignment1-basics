<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A full Pre-Norm decoder layer and the final norm</title>
  <desc id="desc">A complete Pre-Norm Transformer decoder layer with two sublayers (self-attention and feed-forward), each wrapped as x + Sublayer(Norm(x)), followed by a final normalization before the language-model head.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 14px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow3); }
      .ln { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; }
      .attn { fill: #fde68a; stroke: #f59e0b; stroke-width: 1.5; }
      .ffn { fill: #fbcfe8; stroke: #ec4899; stroke-width: 1.5; }
      .add { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1.5; }
      .final { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.5; }
      .flow { stroke: #475569; stroke-width: 2.4; fill: none; }
      .resid { stroke: #16a34a; stroke-width: 2.8; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg3)"/>
  <text x="60" y="50" class="title">一个完整的 Pre-Norm 解码层（含末端 Final Norm）</text>
  <text x="60" y="78" class="subtitle">两个子层各自遵循 x + Sublayer(Norm(x))；两条绿色恒等残差首尾相接，构成贯穿整块的残差流。</text>

  <!-- residual trunk (green) running bottom to top on the left -->
  <line x1="250" y1="650" x2="250" y2="150" stroke="#16a34a" stroke-width="6"/>

  <!-- bottom input -->
  <text x="180" y="690" class="mono">x&#8343;（层输入：token 表示 + 位置信息）</text>

  <!-- ===== Sublayer 1: attention ===== -->
  <rect x="360" y="560" width="150" height="52" rx="10" class="ln"/>
  <text x="382" y="592" class="mono">RMSNorm</text>
  <rect x="360" y="470" width="150" height="60" rx="10" class="attn"/>
  <text x="372" y="498" class="mono">Multi-Head</text>
  <text x="372" y="518" class="mono">Self-Attention</text>
  <rect x="200" y="400" width="100" height="48" rx="10" class="add"/>
  <text x="243" y="430" class="mono">&#8853;</text>

  <!-- flow attn: trunk -> RMSNorm -> attn -> add(back to trunk) -->
  <path class="flow" d="M250 586 L360 586" marker-end="url(#af)"/>
  <path class="flow" d="M435 560 L435 530" marker-end="url(#af)"/>
  <path class="flow" d="M435 470 C 435 440, 360 424, 300 424" marker-end="url(#af)"/>
  <text x="520" y="516" class="small">h = x + Attn(Norm(x))</text>

  <!-- ===== Sublayer 2: FFN ===== -->
  <rect x="360" y="300" width="150" height="52" rx="10" class="ln"/>
  <text x="382" y="332" class="mono">RMSNorm</text>
  <rect x="360" y="210" width="150" height="60" rx="10" class="ffn"/>
  <text x="388" y="238" class="mono">FFN</text>
  <text x="372" y="258" class="small">SwiGLU / MLP</text>
  <rect x="200" y="150" width="100" height="48" rx="10" class="add"/>
  <text x="243" y="180" class="mono">&#8853;</text>

  <!-- flow ffn: trunk -> RMSNorm -> FFN -> add(back to trunk) -->
  <path class="flow" d="M250 326 L360 326" marker-end="url(#af)"/>
  <path class="flow" d="M435 300 L435 270" marker-end="url(#af)"/>
  <path class="flow" d="M435 210 C 435 180, 360 174, 300 174" marker-end="url(#af)"/>
  <text x="520" y="256" class="small">y = h + FFN(Norm(h))</text>

  <!-- residual arrows showing trunk continues upward as identity -->
  <path class="resid" d="M250 650 L250 448" marker-end="url(#ag)"/>
  <path class="resid" d="M250 400 L250 198" marker-end="url(#ag)"/>
  <path class="resid" d="M250 150 L250 120" marker-end="url(#ag)"/>

  <!-- top: stack repeats + final norm -->
  <text x="150" y="108" class="mono">×L 层重复（残差流不中断）</text>

  <!-- Final norm block on the right -->
  <rect x="720" y="150" width="420" height="470" rx="16" class="card"/>
  <rect x="720" y="150" width="420" height="46" rx="16" fill="#dcfce7"/>
  <text x="744" y="180" class="head">为什么 Pre-Norm 需要一个 Final Norm</text>

  <rect x="820" y="230" width="220" height="54" rx="10" class="final"/>
  <text x="846" y="264" class="mono">Final RMSNorm</text>
  <path class="flow" d="M930 340 L930 288" marker-end="url(#af)"/>
  <rect x="820" y="340" width="220" height="54" rx="10" class="ln"/>
  <text x="852" y="374" class="mono">LM Head</text>

  <text x="744" y="440" class="body">Pre-Norm 的残差流会把每层的子层输出</text>
  <text x="744" y="462" class="body">直接累加，最后一层输出未经过归一化，</text>
  <text x="744" y="484" class="body">数值范数会随层数增长。</text>
  <text x="744" y="516" class="body">因此在进入 LM Head（或输出层）之前，</text>
  <text x="744" y="538" class="body">必须补一个 Final Norm 把尺度拉回稳定区间。</text>
  <text x="744" y="570" class="small">这是 Pre-Norm 架构相较 Post-Norm 的一个“额外”组件。</text>
</svg>
