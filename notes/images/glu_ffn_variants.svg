<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Standard FFN versus GLU-based FFN in a Transformer block</title>
  <desc id="desc">The Transformer feed-forward sublayer is where GLU is used. A standard FFN uses two matrices with one activation, while a GLU FFN such as SwiGLU uses three matrices, a gate projection, a value projection, and a down projection, with the hidden width reduced to keep parameter count comparable.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 29px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13.5px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 14px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow2); }
      .lin { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.4; }
      .act { fill: #fde68a; stroke: #f59e0b; stroke-width: 1.4; }
      .mul { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1.4; }
      .flow { stroke: #475569; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>
  <text x="60" y="48" class="title">GLU 的位置：Transformer 的前馈子层（FFN）</text>
  <text x="60" y="76" class="subtitle">注意力子层负责 token 间混合；FFN 子层负责逐 token 的通道变换——GLU 正是用来替换这个 FFN。</text>

  <!-- ===== standard FFN ===== -->
  <rect x="55" y="110" width="520" height="540" rx="16" class="card"/>
  <rect x="55" y="110" width="520" height="46" rx="16" fill="#fee2e2"/>
  <text x="80" y="140" class="head">标准 FFN（两矩阵，一次激活）</text>

  <rect x="230" y="590" width="170" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="268" y="619" class="mono">输入 x (d)</text>

  <path class="flow" d="M315 590 L315 545" marker-end="url(#a2)"/>
  <rect x="215" y="490" width="200" height="52" rx="10" class="lin"/>
  <text x="235" y="522" class="mono">W&#8321;: d &#8594; d_ff</text>

  <path class="flow" d="M315 490 L315 445" marker-end="url(#a2)"/>
  <rect x="215" y="392" width="200" height="52" rx="10" class="act"/>
  <text x="243" y="424" class="mono">激活 (ReLU/GELU)</text>

  <path class="flow" d="M315 392 L315 347" marker-end="url(#a2)"/>
  <rect x="215" y="294" width="200" height="52" rx="10" class="lin"/>
  <text x="235" y="326" class="mono">W&#8322;: d_ff &#8594; d</text>

  <path class="flow" d="M315 294 L315 250" marker-end="url(#a2)"/>
  <rect x="230" y="200" width="170" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="262" y="229" class="mono">输出 (d)</text>

  <text x="80" y="180" class="small">通常 d_ff = 4d，参数量 &#8776; 2 &#183; d &#183; d_ff</text>

  <!-- ===== GLU FFN ===== -->
  <rect x="625" y="110" width="520" height="540" rx="16" class="card"/>
  <rect x="625" y="110" width="520" height="46" rx="16" fill="#dcfce7"/>
  <text x="650" y="140" class="head">GLU 型 FFN（三矩阵，如 SwiGLU）</text>

  <rect x="800" y="590" width="170" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="838" y="619" class="mono">输入 x (d)</text>

  <!-- split -->
  <path class="flow" d="M885 590 C 760 570, 735 540, 735 510" marker-end="url(#a2)"/>
  <path class="flow" d="M885 590 C 1010 570, 1035 540, 1035 510" marker-end="url(#a2)"/>

  <!-- gate proj + act -->
  <rect x="650" y="458" width="170" height="50" rx="10" class="lin"/>
  <text x="668" y="489" class="mono">W (门): d&#8594;d_ff</text>
  <path class="flow" d="M735 458 L735 420" marker-end="url(#a2)"/>
  <rect x="650" y="368" width="170" height="50" rx="10" class="act"/>
  <text x="690" y="399" class="mono">SiLU</text>

  <!-- value proj -->
  <rect x="950" y="458" width="170" height="50" rx="10" class="lin"/>
  <text x="968" y="489" class="mono">V (值): d&#8594;d_ff</text>

  <!-- multiply -->
  <path class="flow" d="M735 368 C 735 330, 820 320, 860 315" marker-end="url(#a2)"/>
  <path class="flow" d="M1035 458 C 1035 360, 950 325, 910 318" marker-end="url(#a2)"/>
  <circle cx="885" cy="312" r="34" class="mul"/>
  <text x="873" y="321" class="mono">&#8857;</text>

  <!-- down proj -->
  <path class="flow" d="M885 278 L885 250" marker-end="url(#a2)"/>
  <rect x="800" y="200" width="170" height="46" rx="10" class="lin"/>
  <text x="812" y="229" class="mono">W&#8322;: d_ff&#8594;d</text>

  <text x="650" y="180" class="small">三个矩阵，故常把 d_ff 缩到约 (2/3)&#183;4d 以对齐参数量</text>
</svg>
