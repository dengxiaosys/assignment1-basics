<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Taxonomy of position encodings</title>
  <desc id="desc">Position encodings organized by whether they encode absolute or relative position and by where they are injected: added to the input embedding, added as a bias to attention scores, or applied as a rotation on queries and keys. Sinusoidal and learned-absolute are absolute and injected at the input; Shaw, T5 bias and ALiBi are relative and act at the attention-score stage; RoPE is relative-by-rotation on Q and K; NoPE injects nothing and relies on the causal mask.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 29px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .col { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 12.5px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 11.5px Inter, Arial, sans-serif; fill: #64748b; }
      .tag { font: 600 11px Inter, Arial, sans-serif; }
      .card { stroke-width: 1.5; filter: url(#shadow); }
      .abs { fill: #dbeafe; stroke: #60a5fa; }
      .rel { fill: #dcfce7; stroke: #22c55e; }
      .none { fill: #e2e8f0; stroke: #94a3b8; }
      .star { fill: #fef9c3; stroke: #f59e0b; stroke-width: 2.2; filter: url(#shadow); }
      .lane { fill: none; stroke: #cbd5e1; stroke-width: 1.3; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="60" y="48" class="title">位置编码全景：绝对 vs 相对，以及"注入在哪"</text>
  <text x="60" y="76" class="subtitle">横向 = 注入位置（输入端相加 → 给注意力分数加偏置 → 旋转 Q/K）；蓝=绝对，绿=相对，灰=不注入。</text>

  <!-- three lanes -->
  <line class="lane" x1="415" y1="110" x2="415" y2="600"/>
  <line class="lane" x1="775" y1="110" x2="775" y2="600"/>
  <text x="80" y="135" class="col">① 输入端相加</text>
  <text x="450" y="135" class="col">② 注意力分数加偏置</text>
  <text x="810" y="135" class="col">③ 旋转 Q/K</text>

  <!-- lane 1: absolute -->
  <rect x="70" y="160" width="320" height="120" rx="12" class="card abs"/>
  <text x="90" y="188" class="head">正弦 Sinusoidal</text>
  <rect x="300" y="170" width="76" height="22" rx="11" fill="#bfdbfe"/>
  <text x="312" y="186" class="tag" fill="#1d4ed8">绝对·固定</text>
  <text x="90" y="214" class="body">固定 sin/cos 向量按位置加到 embedding</text>
  <text x="90" y="234" class="body">多尺度波长；有一定外推能力</text>
  <text x="90" y="262" class="small">原始 Transformer（2017）</text>

  <rect x="70" y="300" width="320" height="120" rx="12" class="card abs"/>
  <text x="90" y="328" class="head">可学习绝对 Learned Absolute</text>
  <rect x="300" y="310" width="76" height="22" rx="11" fill="#bfdbfe"/>
  <text x="312" y="326" class="tag" fill="#1d4ed8">绝对·学习</text>
  <text x="90" y="354" class="body">可学习位置表，按绝对位置查表相加</text>
  <text x="90" y="374" class="body">简单灵活，但超训练长度无定义</text>
  <text x="90" y="402" class="small">BERT / GPT-2 / ViT</text>

  <!-- lane 2: relative (scores) -->
  <rect x="430" y="160" width="320" height="110" rx="12" class="card rel"/>
  <text x="450" y="188" class="head">Shaw 相对（2018）</text>
  <rect x="660" y="170" width="60" height="22" rx="11" fill="#bbf7d0"/>
  <text x="672" y="186" class="tag" fill="#15803d">相对</text>
  <text x="450" y="214" class="body">按相对距离给 K（可含 V）加相对向量</text>
  <text x="450" y="252" class="small">窗口裁剪 [-k, k]，成本较高</text>

  <rect x="430" y="290" width="320" height="110" rx="12" class="card rel"/>
  <text x="450" y="318" class="head">T5 相对位置偏置</text>
  <rect x="660" y="300" width="60" height="22" rx="11" fill="#bbf7d0"/>
  <text x="672" y="316" class="tag" fill="#15803d">相对</text>
  <text x="450" y="344" class="body">按相对距离分桶，给分数加标量偏置</text>
  <text x="450" y="382" class="small">便宜有效，但偏置较粗</text>

  <rect x="430" y="420" width="320" height="110" rx="12" class="card rel"/>
  <text x="450" y="448" class="head">ALiBi（2021）</text>
  <rect x="660" y="430" width="60" height="22" rx="11" fill="#bbf7d0"/>
  <text x="672" y="446" class="tag" fill="#15803d">相对</text>
  <text x="450" y="474" class="body">给分数减去"距离×斜率"的线性惩罚</text>
  <text x="450" y="512" class="small">无参数，外推强，带近处偏好</text>

  <!-- lane 3: RoPE + NoPE -->
  <rect x="790" y="160" width="340" height="150" rx="12" class="star"/>
  <text x="812" y="190" class="head">RoPE（本文主角）</text>
  <rect x="1050" y="170" width="66" height="22" rx="11" fill="#fde68a"/>
  <text x="1060" y="186" class="tag" fill="#b45309">相对</text>
  <text x="812" y="218" class="body">对每层 Q/K 按位置旋转；点积只依赖 m-n</text>
  <text x="812" y="240" class="body">用绝对方式实现相对效果</text>
  <text x="812" y="262" class="body">便于 PI / NTK / YaRN 长度扩展</text>
  <text x="812" y="292" class="small">RoFormer / LLaMA / Qwen 等</text>

  <rect x="790" y="330" width="340" height="120" rx="12" class="card none"/>
  <text x="812" y="358" class="head">NoPE（不加显式编码）</text>
  <rect x="1050" y="340" width="66" height="22" rx="11" fill="#cbd5e1"/>
  <text x="1058" y="356" class="tag" fill="#475569">无注入</text>
  <text x="812" y="384" class="body">因果 mask 已打破置换对称，隐式带序信息</text>
  <text x="812" y="404" class="body">仅适用于 decoder-only 因果模型</text>
  <text x="812" y="432" class="small">近年研究发现其可与显式编码竞争</text>

  <text x="790" y="500" class="small">注：RoPE 虽然"作用在 Q/K"，但本质是相对位置编码——这正是它把两栏优点合一的地方。</text>
</svg>
