<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Byte-level BPE training and encoding pipeline</title>
  <desc id="desc">A diagram showing corpus segmentation, pre-tokenization, UTF-8 byte conversion, iterative pair merging, vocabulary construction, and encoding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .step { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .mono { font: 500 14px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .token { stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="55" class="title">Byte-level BPE: training and encoding</text>
  <text x="60" y="82" class="subtitle">Training learns a byte vocabulary and an ordered merge table; encoding replays those learned merges.</text>

  <rect x="55" y="120" width="190" height="170" class="box"/>
  <circle cx="85" cy="150" r="17" fill="#dbeafe"/>
  <text x="80" y="156" class="step" fill="#1d4ed8">1</text>
  <text x="112" y="156" class="step">Corpus</text>
  <text x="75" y="190" class="body">Documents are separated</text>
  <text x="75" y="212" class="body">by hard boundaries.</text>
  <text x="75" y="247" class="mono">doc A</text>
  <text x="75" y="270" class="mono">&lt;|endoftext|&gt;</text>

  <rect x="285" y="120" width="190" height="170" class="box"/>
  <circle cx="315" cy="150" r="17" fill="#dcfce7"/>
  <text x="310" y="156" class="step" fill="#15803d">2</text>
  <text x="342" y="156" class="step">Pre-tokenize</text>
  <text x="305" y="190" class="body">Regex creates local units</text>
  <text x="305" y="212" class="body">and a frequency table.</text>
  <text x="305" y="247" class="mono">" low"  x 5</text>
  <text x="305" y="270" class="mono">" lower" x 2</text>

  <rect x="515" y="120" width="190" height="170" class="box"/>
  <circle cx="545" cy="150" r="17" fill="#fef3c7"/>
  <text x="540" y="156" class="step" fill="#b45309">3</text>
  <text x="572" y="156" class="step">UTF-8 bytes</text>
  <text x="535" y="190" class="body">Every pre-token becomes</text>
  <text x="535" y="212" class="body">a sequence over 0..255.</text>
  <text x="535" y="247" class="mono">l  o  w</text>
  <text x="535" y="270" class="mono">6c 6f 77</text>

  <rect x="745" y="120" width="190" height="170" class="box"/>
  <circle cx="775" cy="150" r="17" fill="#fae8ff"/>
  <text x="770" y="156" class="step" fill="#a21caf">4</text>
  <text x="802" y="156" class="step">Pair merges</text>
  <text x="765" y="190" class="body">Count adjacent pairs,</text>
  <text x="765" y="212" class="body">merge the most frequent.</text>
  <text x="765" y="247" class="mono">(o, w) -&gt; ow</text>
  <text x="765" y="270" class="mono">(l, ow) -&gt; low</text>

  <rect x="975" y="120" width="170" height="170" class="box"/>
  <circle cx="1005" cy="150" r="17" fill="#ffe4e6"/>
  <text x="1000" y="156" class="step" fill="#be123c">5</text>
  <text x="1032" y="156" class="step">Artifacts</text>
  <text x="995" y="190" class="body">Vocabulary:</text>
  <text x="995" y="212" class="mono">id -&gt; bytes</text>
  <text x="995" y="246" class="body">Merge ranks:</text>
  <text x="995" y="268" class="mono">pair -&gt; rank</text>

  <path d="M245 205 H278" class="arrow"/>
  <path d="M475 205 H508" class="arrow"/>
  <path d="M705 205 H738" class="arrow"/>
  <path d="M935 205 H968" class="arrow"/>

  <rect x="55" y="335" width="1090" height="325" class="box"/>
  <text x="85" y="380" class="step">One merge round</text>
  <text x="85" y="405" class="body">The frequency of a pair is weighted by the frequency of every pre-token containing that adjacent pair.</text>

  <text x="85" y="455" class="small">BEFORE</text>
  <rect x="85" y="470" width="62" height="42" class="token" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="155" y="470" width="62" height="42" class="token" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="225" y="470" width="62" height="42" class="token" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="110" y="497" class="mono">l</text>
  <text x="180" y="497" class="mono">o</text>
  <text x="250" y="497" class="mono">w</text>
  <text x="305" y="497" class="body">x 5</text>

  <rect x="85" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="155" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="225" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="295" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="365" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <text x="110" y="557" class="mono">l</text>
  <text x="180" y="557" class="mono">o</text>
  <text x="250" y="557" class="mono">w</text>
  <text x="320" y="557" class="mono">e</text>
  <text x="390" y="557" class="mono">r</text>
  <text x="445" y="557" class="body">x 2</text>

  <text x="505" y="455" class="small">PAIR COUNT</text>
  <text x="505" y="490" class="mono">count(o, w) = 5 + 2 = 7</text>
  <path d="M500 520 H650" class="arrow"/>
  <text x="505" y="555" class="body">Select the highest-frequency pair</text>
  <text x="505" y="578" class="body">using a deterministic tie-break rule.</text>

  <text x="745" y="455" class="small">AFTER MERGING (o, w)</text>
  <rect x="745" y="470" width="62" height="42" class="token" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="815" y="470" width="92" height="42" class="token" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="770" y="497" class="mono">l</text>
  <text x="845" y="497" class="mono">ow</text>
  <text x="925" y="497" class="body">x 5</text>

  <rect x="745" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="815" y="530" width="92" height="42" class="token" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="915" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="985" y="530" width="62" height="42" class="token" fill="#dcfce7" stroke="#4ade80"/>
  <text x="770" y="557" class="mono">l</text>
  <text x="845" y="557" class="mono">ow</text>
  <text x="940" y="557" class="mono">e</text>
  <text x="1010" y="557" class="mono">r</text>
  <text x="1065" y="557" class="body">x 2</text>

  <rect x="745" y="600" width="302" height="38" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="765" y="624" class="mono">new token: b"ow"; append merge rank</text>
</svg>
